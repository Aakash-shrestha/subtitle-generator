[project]
name = "subtitle-generator"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "faster-whisper>=1.2.1",
    "ffmpeg-python>=0.2.0",
    "pyannote-audio>=4.0.7",
    "python-dotenv>=1.2.2",
    "typer>=0.25.1",
]

[project.scripts]
subtitle-generator = "subtitle_generator.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_generator"]
